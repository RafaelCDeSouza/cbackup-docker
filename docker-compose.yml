services:
  cbackup-db:
    image: mariadb:10.6
    container_name: cbackup-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cbackup}
      MYSQL_USER: ${MYSQL_USER:-cbackup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cbackup_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - cbackup_db:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - external

  cbackup-web:
    image: rafaelcdesouza/cbackup-web:0.1.5
    build:
    #   context: .
      dockerfile: docker/web/Dockerfile
      args:
        CBACKUP_CORE_REPO: ${CBACKUP_CORE_REPO:-https://github.com/cBackup/core.git}
        CBACKUP_CORE_BRANCH: ${CBACKUP_CORE_BRANCH:-master}
    container_name: cbackup-web
    restart: unless-stopped
    depends_on:
      cbackup-db:
        condition: service_healthy
    ports:
      - "${CBACKUP_HTTP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: cbackup-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-cbackup}
      DB_USER: ${MYSQL_USER:-cbackup}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cbackup_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      CBACKUP_SSH_ROOT_PASSWORD: ${CBACKUP_SSH_ROOT_PASSWORD:-cbackup}
      CBACKUP_COOKIE_KEY: ${CBACKUP_COOKIE_KEY:-}
      JAVA_HOST: cbackup-daemon
      JAVA_SCHEDULER_USER: ${JAVA_SCHEDULER_USER:-cbadmin}
      JAVA_SCHEDULER_PASS: ${JAVA_SCHEDULER_PASS:-cbackup}
      CBACKUP_TOKEN: ${CBACKUP_TOKEN:-}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        ln -sf /opt/cbackup/runtime/.install.lock /opt/cbackup/install.lock 2>/dev/null || true;
        exec cbackup-web-entrypoint apache2-foreground
    volumes:
      - cbackup_config:/opt/cbackup/config
      - cbackup_web_runtime:/opt/cbackup/runtime
      - cbackup_web_assets:/opt/cbackup/web/assets
      - cbackup_data:/opt/cbackup/data
      - cbackup_logs:/var/log/cbackup
      - cbackup_git:/opt/cbackup/git
      - cbackup_bin:/opt/cbackup/bin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cbackup.entrypoints=web,web-secure"
      - "traefik.http.routers.cbackup.rule=Host(`cbackup.rafaelcdesouza.io`)"
      - "traefik.http.routers.cbackup.tls=true"
      - "traefik.http.routers.cbackup.middlewares=secHeaders@file"
      - "traefik.http.services.cbackup.loadbalancer.server.port=80"
    networks:
      - external

  cbackup-daemon:
    image: rafaelcdesouza/cbackup-daemon:0.1.5
    # build:
    #   context: .
    #   dockerfile: docker/daemon/Dockerfile
    #   args:
    #     CBACKUP_WORKER_REPO: ${CBACKUP_WORKER_REPO:-https://github.com/cBackup/worker.git}
    #     CBACKUP_WORKER_BRANCH: ${CBACKUP_WORKER_BRANCH:-master}
    container_name: cbackup-daemon
    restart: unless-stopped
    depends_on:
      cbackup-db:
        condition: service_healthy
    ports:
      - "${CBACKUP_DAEMON_SSH_PORT:-8437}:8437"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: cbackup-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-cbackup}
      DB_USER: ${MYSQL_USER:-cbackup}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cbackup_pass}
      CBACKUP_SCHEME: ${CBACKUP_SCHEME:-http}
      CBACKUP_SITE: ${CBACKUP_SITE:-cbackup-web}
      CBACKUP_TOKEN: ${CBACKUP_TOKEN:-}
      CBACKUP_SSH_ROOT_PASSWORD: ${CBACKUP_SSH_ROOT_PASSWORD:-cbackup}
      # Embedded SSH server (sshd-shell-spring-boot-starter) — porta 8437
      SSHD_SHELL_ENABLED: "true"
      SSHD_SHELL_PORT: "8437"
      SSHD_SHELL_HOST: "0.0.0.0"
      SSHD_SHELL_USERNAME: ${JAVA_SCHEDULER_USER:-cbadmin}
      SSHD_SHELL_PASSWORD: ${JAVA_SCHEDULER_PASS:-cbackup}
    volumes:
      - cbackup_data:/opt/cbackup/data
      - cbackup_logs:/var/log/cbackup
      - cbackup_git:/opt/cbackup/git
      - cbackup_bin:/opt/cbackup/bin
    networks:
      - external

volumes:
  cbackup_db:
  cbackup_config:
  cbackup_web_runtime:
  cbackup_web_assets:
  cbackup_data:
  cbackup_logs:
  cbackup_git:
  cbackup_bin:

networks:
  external:
    external: true
